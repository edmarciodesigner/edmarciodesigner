name: Publicar portfólio no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publicar site estático
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos para publicação
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src _site/src
          touch _site/.nojekyll
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
